# Activate with spring.profiles.active=prod.
#
# API docs are enabled by default (see application.properties) so they're
# reachable in dev/test without extra config. In prod they'd expose the full
# API surface to anyone who can reach the app, so this profile turns them off.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No fallback on purpose: application.properties' app.jwt.secret is a public,
# checked-in dev value, so prod must not be able to silently start with it.
# ${JWT_SECRET} with no default means Spring itself refuses to start if the
# JWT_SECRET environment variable / secrets-manager entry isn't provided.
app.jwt.secret=${JWT_SECRET}
