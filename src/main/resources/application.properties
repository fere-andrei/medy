spring.application.name=medy
spring.jpa.hibernate.ddl-auto=validate
# No-op outside local dev/test (only applies when compose.yaml is present).
spring.docker.compose.skip.in-tests=false

# Dev-only secret, fine for local/test. application-prod.properties
# overrides this with ${JWT_SECRET} (no default), so a real deployment
# can't start without a real secret provided via an environment variable
# or secrets manager.
app.jwt.secret=5OicXJX5wbNXLcPFO5fSTsJSRmsSN9a8dV5CwWSyjn5B3NQ2WCfUaI8ITk2OoPsW
app.jwt.expiration-minutes=480

# API docs (springdoc) are on by default here for local dev/test convenience.
# Real deployments must run with spring.profiles.active=prod (see
# application-prod.properties) to turn them off.
